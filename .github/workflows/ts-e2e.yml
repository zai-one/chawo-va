# Tests and the end-to-end smoke of the Electron/TypeScript port (ts/) on Linux: unit tests, then
# scripts/e2e-smoke.cjs — every chawo-va command and the GUI under xvfb, in a temp profile with a fake
# Brain on 127.0.0.1. No model weights are downloaded here, so the real-transcription cases are skipped
# (run `npm run e2e` with CHAWO_SMOKE_MODEL_DIR / CHAWO_SMOKE_AUDIO locally for those).
name: TS E2E

on:
  push:
    branches: ['ts-port', 'ts/**']
    paths: ['ts/**', 'docs/openapi.yaml', '.github/workflows/ts-e2e.yml']
  pull_request:
    branches: ['main', 'ts-port']
    paths: ['ts/**', 'docs/openapi.yaml', '.github/workflows/ts-e2e.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ts-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: System packages (xvfb for the GUI)
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: End-to-end smoke (CLI + GUI under xvfb)
        run: npm run e2e -- --shots e2e-shots

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ts-e2e-screenshots
          path: ts/e2e-shots
          if-no-files-found: ignore
