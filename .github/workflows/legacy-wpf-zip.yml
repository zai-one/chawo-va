# Legacy WPF app (legacy/wpf, 1.x): self-contained win-x64 folder, DirectML, no speech weights. Started by hand.
name: Legacy WPF zip

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zip:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: legacy/wpf
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish the app
        run: dotnet publish src/ChawoVoiceAssistant.csproj -c Release -r win-x64 --self-contained true -o dist/app -nologo

      - name: Bundle runtime and the Telegram bot, then zip
        shell: pwsh
        run: |
          foreach ($dll in 'msvcp140.dll', 'msvcp140_1.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" dist/app/
          }
          New-Item -ItemType Directory -Force dist/app/hermes-telegram-bot | Out-Null
          Copy-Item ../../tools/hermes-telegram-bot/bot.py dist/app/hermes-telegram-bot/
          Copy-Item ../../tools/hermes-telegram-bot/bot-config.example.json dist/app/hermes-telegram-bot/
          Compress-Archive -Path dist/app/* -DestinationPath dist/ChawoVoiceAssistant-win-x64.zip -Force
          Get-Item dist/ChawoVoiceAssistant-win-x64.zip | Select-Object FullName, Length

      - uses: actions/upload-artifact@v7
        with:
          name: ChawoVoiceAssistant-win-x64
          path: legacy/wpf/dist/ChawoVoiceAssistant-win-x64.zip
          if-no-files-found: error
