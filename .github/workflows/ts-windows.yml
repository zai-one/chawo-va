# Windows build of the Electron app (apps/desktop): an installer (NSIS, per-user, folder can be changed)
# and a portable zip. Both carry the chawo-va CLI (chawo-va.cmd next to the exe). No speech or Brain
# weights inside: the app downloads them on first use. Built only from this repository's source.
# Hardened: Electron fuses (no NODE_OPTIONS, no --inspect, app only from app.asar with integrity check,
# no extra file:// privileges; RunAsNode stays on for chawo-va.cmd) — checked on the built exe.
# Signing turns on by itself once the repository has it (Settings → Secrets and variables → Actions):
#   Azure Trusted Signing — secrets AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET and variables
#     AZURE_SIGN_ENDPOINT, AZURE_SIGN_ACCOUNT, AZURE_SIGN_PROFILE, AZURE_SIGN_PUBLISHER;
#   or a .pfx — secrets WIN_CSC_LINK (base64 of the file) and WIN_CSC_KEY_PASSWORD.
# Without either the build is unsigned, as before.
# On a v* tag the same artifacts are attached to the GitHub Release for that tag.
name: TS Windows

on:
  push:
    branches: ['main', 'ts-port', 'ts/**']
    tags: ['v*']
  pull_request:
    branches: ['main', 'ts-port']
    paths: ['apps/**', 'packages/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/ts-windows.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ts-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    # write: attach Setup.exe + zip to the GitHub Release on v* tags (softprops/action-gh-release).
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
      AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
      AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
      AZURE_SIGN_PUBLISHER: ${{ vars.AZURE_SIGN_PUBLISHER }}
    steps:
      - uses: actions/checkout@v7

      # pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      # Global hold key / text insertion helper (.NET Framework 4.8, ships with Windows 10/11).
      - name: Build the native helper
        run: pnpm build:native

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Signing
        id: sign
        run: node scripts/signing-config.mjs "$env:RUNNER_TEMP/builder.json"

      - name: Build and package
        run: |
          pnpm build
          pnpm package:win --config "$env:RUNNER_TEMP/builder.json"

      - name: Fuses
        run: node scripts/check-fuses.mjs release/win-unpacked/ChawoVoiceAssistant.exe

      - name: Signatures
        if: steps.sign.outputs.signing != 'none'
        shell: pwsh
        run: |
          $bad = Get-ChildItem release/*.exe, release/win-unpacked/ChawoVoiceAssistant.exe | Get-AuthenticodeSignature | Where-Object Status -ne 'Valid'
          if ($bad) { $bad | Format-Table Status, Path -AutoSize; Write-Error 'unsigned or invalid signature'; exit 1 }
          Get-ChildItem release/*.exe | Get-AuthenticodeSignature | Format-Table Status, SignerCertificate, Path -AutoSize

      - name: Smoke-test the packaged app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Resolve-Path 'release/win-unpacked'
          function Fail($m) { Write-Error $m; exit 1 }

          # 1. No model weights in the package.
          $weights = Get-ChildItem $app -Recurse -Include *.onnx,*.ort,*.gguf,*.safetensors,*.pt,*.pth,*.ckpt
          if ($weights) { $weights | ForEach-Object FullName; Fail 'model weights found in the package' }

          # 2. The native helper is next to the app (resources\native).
          if (-not (Test-Path "$app/resources/native/ChawoNative.exe")) { Fail 'ChawoNative.exe missing' }

          # 3. The CLI runs from the package.
          $v = & "$app/chawo-va.cmd" --version
          if ($LASTEXITCODE -ne 0 -or "$v" -notmatch '^chawo-va \d') { Fail "chawo-va --version: $v" }
          Write-Host $v
          $seg = & "$app/chawo-va.cmd" segments "$env:GITHUB_WORKSPACE/fixtures/transcript-editor/sample.srt"
          if ($LASTEXITCODE -ne 0 -or @($seg).Count -ne 3 -or "$seg" -notmatch 'Speaker 2: Second phrase') { Fail "chawo-va segments: $seg" }
          $seg | Write-Host

          # 4. The Windows native modules load from app.asar.unpacked in the packaged runtime.
          $env:ELECTRON_RUN_AS_NODE = '1'
          $asar = "$app/resources/app.asar"
          $js = "const o=require(process.argv[1]+'/node_modules/onnxruntime-node');const s=require(process.argv[1]+'/node_modules/sherpa-onnx-node');" +
                "const k=require(process.argv[1]+'/node_modules/@napi-rs/keyring');new k.Entry('Chawo Voice Assistant','ci-probe').getPassword();" +
                "if(typeof o.InferenceSession.create!=='function'||typeof s.OfflineRecognizer!=='function')process.exit(2);console.log('native modules ok (incl. Credential Manager)')"
          & "$app/ChawoVoiceAssistant.exe" -e $js $asar
          if ($LASTEXITCODE -ne 0) { Fail 'native modules did not load' }
          Remove-Item Env:ELECTRON_RUN_AS_NODE

          # 5. The GUI starts, stays up and finds its native helper.
          $p = Start-Process "$app/ChawoVoiceAssistant.exe" -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) { Fail "the app exited with code $($p.ExitCode)" }
          $log = "$env:LOCALAPPDATA/ChawoVoiceAssistant/chawo-va.log"
          if (Test-Path $log) { Get-Content $log | Write-Host }
          Get-Process ChawoVoiceAssistant, ChawoNative -ErrorAction SilentlyContinue | Format-Table Name, Id
          if (-not (Get-Process ChawoNative -ErrorAction SilentlyContinue)) { Fail 'ChawoNative.exe did not start' }
          Get-Process ChawoVoiceAssistant, ChawoNative -ErrorAction SilentlyContinue | Stop-Process -Force

      # 6. The window of the packaged (fused) app: chawo-app:// from app.asar, every page, no console errors.
      - name: Smoke-test the packaged window (Playwright over CDP)
        run: node scripts/check-packaged.mjs release/win-unpacked/ChawoVoiceAssistant.exe

      - name: Checksums
        shell: pwsh
        run: Get-ChildItem release/*.exe, release/*.zip | Get-FileHash -Algorithm SHA256 | Format-Table Hash, Path -AutoSize

      - uses: actions/upload-artifact@v7
        with:
          name: ChawoVoiceAssistant-win-x64-setup
          path: apps/desktop/release/*-Setup.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: ChawoVoiceAssistant-win-x64-portable
          path: apps/desktop/release/*-win-x64.zip
          if-no-files-found: error

      # Attach Setup.exe + portable zip to the GitHub Release for this tag (no model weights).
      # Release notes: docs/releases/<tag>.md when there is one.
      - name: Release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $notes = "$env:GITHUB_WORKSPACE/docs/releases/$env:GITHUB_REF_NAME.md"
          "name=Chawo Voice Assistant $($env:GITHUB_REF_NAME.TrimStart('v'))" >> $env:GITHUB_OUTPUT
          if (Test-Path $notes) { "body_path=$notes" >> $env:GITHUB_OUTPUT }

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.notes.outputs.name }}
          body_path: ${{ steps.notes.outputs.body_path }}
          files: |
            apps/desktop/release/*-Setup.exe
            apps/desktop/release/*-win-x64.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
